packages:
  - "packages/*"

# Let plain pnpm fallbacks delegate to the exact repo pin. The package engine
# range also permits the previous 10.33.2 launcher to finish the one-time handoff;
# refreshed launchers then obtain the hash-pinned version without a manual restart.
managePackageManagerVersions: true

# Supply-chain guardrails: delay newly published package versions long enough for
# registry takedowns and advisory systems to catch common compromise waves.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
# Released installs must remain reproducible even when older dependency versions
# lose trust metadata across pnpm or registry updates.
trustPolicy: off
# Updaters and installers run non-interactively; allow pnpm to repair stale or
# partially created node_modules instead of aborting on its confirmation prompt.
confirmModulesPurge: false
blockExoticSubdeps: true

patchedDependencies:
  onnxruntime-node@1.30.0: patches/onnxruntime-node@1.30.0.patch
  # Upstream READY-handshake fix (pinojs/thread-stream#246, #251). Drop once a release after 4.2.0 ships it.
  thread-stream@4.2.0: patches/thread-stream@4.2.0.patch

# Native/build dependencies permitted to run install scripts.
# pnpm 11 replaced onlyBuiltDependencies with the allowBuilds map. The list is
# retained so a transitional pnpm 10 launcher still permits the same four
# packages; keep the two in sync until the pnpm 10 range leaves `engines`.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - onnxruntime-node
  - protobufjs

allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# Dependency version pins applied across the workspace. pnpm 11 no longer reads
# package.json#pnpm, so every override must live here or it is silently dropped.
overrides:
  "@anthropic-ai/sdk": "0.93.0"
  "@babel/core": "7.29.6"
  "@babel/plugin-transform-modules-systemjs": "7.29.4"
  "@fastify/busboy@<3.2.2": "3.2.2"
  "@hono/node-server": "2.0.10"
  "@modelcontextprotocol/sdk": "1.32.1"
  "adm-zip@<0.6.1": "0.6.1"
  body-parser: "2.3.0"
  brace-expansion: "5.0.12"
  "brace-expansion@>=2 <2.1.7": "2.1.7"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
  browserslist: "4.28.7"
  "fast-copy@>=4 <4.1.1": "4.1.1"
  "fast-uri@>=3 <3.1.8": "3.1.8"
  "fast-uri@>=4 <4.1.5": "4.1.5"
  hono: "4.13.11"
  ip-address: "10.7.1"
  js-yaml: "4.3.2"
  "nanoid@3": "3.3.19"
  # Match Transformers.js; each backend keeps its own matching common runtime.
  onnxruntime-node: "1.30.0"
  onnxruntime-web: "1.31.0-dev.20260914-8d85527a0"
  postcss: "8.5.28"
  # 7.6.5 supersedes the earlier 7.5.5 pin (chore: patch production
  # dependencies for v2.4.0). Do not reintroduce 7.5.5.
  protobufjs: "7.6.5"
  "proxy-addr@<2.0.8": "2.0.8"
  qs: "6.16.0"
  "sharp@0.34.5": "0.35.5"
  "source-map-js@<1.2.2": "1.2.2"
  ws: "8.21.0"
